name: Frontend CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Build Angular
        run: npm run build

      - name: SonarCloud Analysis
        run: |
          npm install -g sonar-scanner
          sonar-scanner \
            -Dsonar.projectKey=AlejandroCaycho_AS241S5_AEJ_07-fe \
            -Dsonar.organization=alejandrocaycho \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Build Docker
        run: docker build -t carloscaycho/frontend:latest .

      - name: Login DockerHub
        run: echo ${{ secrets.DOCKER_PASS }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Push Docker
        run: docker push carloscaycho/frontend:latest
